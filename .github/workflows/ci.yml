name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI uses no private infrastructure and no credentials. This adapter builds on
# the OSS middag-io/framework and the php-stubs/wordpress-stubs dev dependency,
# all resolved from Packagist.

jobs:
  # Released php-library-check composite of middag-io/actions, called by its
  # major tag. One job per PHP version, with the platform pin (8.3.0) kept:
  # the static checks (composer validate, strict PSR-4, PHPStan, PHP-CS-Fixer
  # and Rector) run on 8.3, the floor; the audit and PHPUnit on every
  # version. The 8.6 cell also runs PHPStan read as PHP 8.6, the ceiling
  # (.phpstan.ceiling.neon). The tool caches live in .cache.
  php-library-check:
    name: check (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5', '8.6']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: middag-io/actions/php-library-check@php-library-check-v1
        with:
          php-version: ${{ matrix.php-version }}
          static-checks: ${{ matrix.php-version == '8.3' }}
          tool-cache-paths: .cache
          lint-script: lint:php83
          audit-blocking-severities: critical, high

      - name: PHPStan read as PHP 8.6 (ceiling)
        if: matrix.php-version == '8.6'
        run: composer check:stan:ceiling

  # Second use of the same composite: removes the platform pin and resolves
  # the highest dependency versions on the PHP of each job, then asserts that
  # every Symfony package of this adapter resolved to 8.x (Symfony 8 needs PHP
  # 8.4 or later, so 8.3 stays in the locked job). The static checks already
  # run in the locked job.
  php-library-check-highest:
    name: check (PHP ${{ matrix.php-version }}, highest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5', '8.6']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: middag-io/actions/php-library-check@php-library-check-v1
        with:
          php-version: ${{ matrix.php-version }}
          static-checks: 'false'
          dependency-versions: highest
          unset-platform-php: 'true'
          expect-majors: |
            symfony/dependency-injection:8
            symfony/http-foundation:8
            symfony/psr-http-message-bridge:8
            symfony/routing:8
          composer-validate: 'false'
          strict-psr: 'false'
          phpstan-script: ""
          cs-fixer-script: ""
          rector-script: ""
          audit-blocking-severities: critical, high

  # Third use of the same composite: removes the platform pin and resolves
  # the lowest dependency versions on PHP 8.3 (composer update
  # --prefer-lowest --prefer-stable), then asserts that every Symfony package
  # resolved to 7.x. The constraints '^7.4 || ^8.1' resolve to 7.4.0, so this
  # cell proves the 7.x floor together with the declared PHP and extension
  # floors. The static checks already run in the locked job.
  php-library-check-lowest:
    name: check (PHP 8.3, lowest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: middag-io/actions/php-library-check@php-library-check-v1
        with:
          php-version: '8.3'
          static-checks: 'false'
          dependency-versions: lowest
          unset-platform-php: 'true'
          expect-majors: |
            symfony/dependency-injection:7
            symfony/http-foundation:7
            symfony/routing:7
          composer-validate: 'false'
          strict-psr: 'false'
          phpstan-script: ""
          cs-fixer-script: ""
          rector-script: ""
          audit-blocking-severities: critical, high

  # Host matrix, specific to this repository: PHPStan against the WordPress
  # stubs of each WordPress major in range (the latest major and the previous
  # one). The unit tests run on hand-written stubs and do not change per
  # WordPress version; this job is what proves that every WordPress function,
  # class and signature the adapter calls exists in each supported version.
  wordpress-matrix:
    name: PHPStan (wordpress-stubs ${{ matrix.stubs }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        stubs: ['~7.0.0', '~7.1.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: middag-io/actions/php-composer-setup@php-composer-setup-v1
        with:
          php-version: '8.3'

      - name: Pin wordpress-stubs to the matrix series
        env:
          STUBS: ${{ matrix.stubs }}
        run: composer require --dev "php-stubs/wordpress-stubs:${STUBS}" --with-all-dependencies --no-interaction

      - name: PHPStan against the matrix stubs
        run: composer check:stan

  # Integration suite, specific to this repository: tests/Integration runs on
  # a real WordPress and a real MySQL database (the unit suite of
  # php-library-check runs on hand-written stubs). Support window: the adapter
  # supports the latest WordPress major and the previous one; the previous
  # major leaves this matrix 6 months after a new major is released.
  # bin/wp-integration-setup.sh installs the newest patch release of each
  # major from wordpress.org and verifies its checksum. No cache step: caching
  # belongs to the shared components.
  wordpress-integration:
    name: Integration (WordPress ${{ matrix.wordpress }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        wordpress: ['7.0', '7.1']
    services:
      mysql:
        image: public.ecr.aws/docker/library/mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
        ports:
          - 127.0.0.1:3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=wordpress --password=wordpress"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      WORDPRESS_DIR: ${{ github.workspace }}/.wordpress/${{ matrix.wordpress }}
      WORDPRESS_MAJOR: ${{ matrix.wordpress }}
      WORDPRESS_DB_HOST: 127.0.0.1:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: middag-io/actions/php-composer-setup@php-composer-setup-v1
        with:
          php-version: '8.3'
          php-extensions: mbstring, xml, mysqli

      - name: Install WordPress ${{ matrix.wordpress }}
        run: bin/wp-integration-setup.sh "$WORDPRESS_MAJOR" "$WORDPRESS_DIR"

      - name: Integration suite
        run: composer test:integration

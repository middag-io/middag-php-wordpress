name: Version family

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  # Steps of the released php-version-family-check composite of
  # middag-io/actions. The job name keeps the required check of the
  # "PHP library family window" ruleset.
  php-version-family-check:
    name: php-version-family-check / check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: middag-io/actions/php-version-family-check@php-version-family-check-v1
        with:
          # The family window is the repository variable PHP_LIBS_OPEN_RELEASE,
          # set per repository and never on the organization (empty = closed,
          # X.Y = family MINOR window, X.0 = family MAJOR window).
          window: ${{ vars.PHP_LIBS_OPEN_RELEASE }}
          family-from: 2.0.0-rc.1
          title: ${{ github.event.pull_request.title }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          base-ref: ${{ github.event.pull_request.base.ref }}
          window-branch: ${{ github.event.repository.default_branch }}

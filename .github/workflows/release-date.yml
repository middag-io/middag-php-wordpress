name: Release date

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# release-please walks main newest committer date first and stops at the
# commit of the last release, so a commit dated before that release is never
# read: it is missing from the changelog and from the next version. This job
# fails such a pull request and prints how to recreate the branch with
# cherry-pick (never rebase or force-push). A step of the released
# github-release-date-check composite of middag-io/actions, called by its
# major tag.
permissions: {}

jobs:
  github-release-date-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: middag-io/actions/github-release-date-check@github-release-date-check-v1
        with:
          base-ref: ${{ github.event.pull_request.base.ref }}
          head-sha: ${{ github.event.pull_request.head.sha }}

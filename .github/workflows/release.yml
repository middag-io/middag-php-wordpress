name: Release

# Opens or updates the release pull request from the Conventional Commits on
# main and, when that pull request merges, creates the tag and the GitHub
# release.
#
# release-please runs through the release-please component of
# middag-io/actions, called by its major tag, with the
# token of the release GitHub App (client id in an organization variable,
# private key in an organization secret). A release pull request opened or
# updated with the App token triggers the pull request workflows of this
# repository, including the required version family check.
#
# The release is gated on a green CI run of a push to main. The
# workflow_run trigger fires only after CI finishes; the job guard requires
# success. workflow_dispatch bypasses the gate deliberately (retry). Never
# publish a tag while CI is red. No paths filter: the merge of the release
# pull request must always run release-please. workflow_run runs nothing from
# the triggering run: the component checks out only the configuration and the
# manifest of the default branch, and the job also requires a push event.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      reference-tag:
        description: Existing release tag (for example v1.18.1) whose API reference to publish again. Empty runs release-please only.
        type: string
        required: false
        default: ""

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    uses: middag-io/actions/.github/workflows/release-please.yml@release-please-v1
    # The component only checks out the configuration and the manifest; every
    # write (release branch, pull request, tag, release) uses the App token.
    permissions:
      contents: read
    with:
      config-file: release-please-config.json
      manifest-file: .release-please-manifest.json
      app-client-id: ${{ vars.GH_APPS_MIDDAG_CI_RELEASE_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.GH_APPS_MIDDAG_CI_RELEASE_PRIVATE_KEY }}

  # API reference (kind xref) of each release, generated with phpDocumentor
  # and uploaded to the public docs bucket by the reference publish component
  # (ADR-015/016/020 of docs-middag-ops). The component fails unless this
  # repository is public. write-manifest stays false: the manifest belongs to
  # the docs publication. A workflow_dispatch with reference-tag republishes
  # an existing release (backfill or retry).
  reference:
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.release-created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.reference-tag != '')) }}
    permissions:
      contents: read
    uses: middag-io/actions/.github/workflows/cloudflare-r2-reference-publish.yml@cloudflare-r2-reference-publish-v1
    with:
      generator: phpdocumentor
      ref: ${{ needs.release-please.outputs.tag-name || inputs.reference-tag }}
      source-paths: src
      write-manifest: false
    secrets:
      endpoint: ${{ secrets.CLOUDFLARE_R2_DOCS_PUBLISH_ENDPOINT }}
      access-key-id: ${{ secrets.CLOUDFLARE_R2_DOCS_PUBLISH_ACCESS_KEY_ID }}
      secret-access-key: ${{ secrets.CLOUDFLARE_R2_DOCS_PUBLISH_SECRET_ACCESS_KEY }}
